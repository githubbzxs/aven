<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1650" viewBox="0 0 1440 1650">
  <defs>
    <linearGradient id="futureFade" x1="0" x2="1">
      <stop offset="0%" stop-color="#9B5CFF" stop-opacity=".52"/>
      <stop offset="48%" stop-color="#9B5CFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#9B5CFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .title { font: 700 54px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif; fill:#f5f5f5 }
      .h { font: 700 32px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif; fill:#f5f5f5 }
      .b { font: 400 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif; fill:#9b9b9b }
      .s { font: 600 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif; fill:#d4d4d4 }
    </style>
  </defs>

  <rect width="1440" height="1650" fill="#141513"/>
  <text x="70" y="82" class="title">Aven 曲线交互动效图解</text>
  <text x="72" y="126" class="b">更清楚、更轻：曲线只在真正切换数据时动。</text>

  <rect x="55" y="170" width="1330" height="400" rx="32" fill="#1d1e1c"/>
  <circle cx="105" cy="224" r="24" fill="#9757ff"/><text x="105" y="232" text-anchor="middle" class="s" fill="#fff">1</text>
  <text x="155" y="218" class="h">历史点之后：预亮不动，只抬高未预亮底线</text>
  <text x="155" y="256" class="b">选中点后的短预亮保持原样；再往后的整段曲线只把基础亮度稍微抬高，仍保持弱层级。</text>
  <path d="M115 455 C220 385,290 475,390 390 S535 365,625 310 S760 335,845 275 S980 430,1090 330" fill="none" stroke="#9b5cff" stroke-width="10" opacity=".22" filter="url(#glow)"/>
  <path d="M115 455 C220 385,290 475,390 390 S535 365,625 310 S760 335,845 275 S980 430,1090 330" fill="none" stroke="#9b5cff" stroke-width="4.5"/>
  <circle cx="850" cy="309" r="7" fill="#fff"/>
  <line x1="850" y1="282" x2="850" y2="468" stroke="#fff" stroke-opacity=".24" stroke-dasharray="4 7"/>
  <path d="M850 309 C910 322,958 390,1020 390 S1100 334,1190 300 S1270 305,1340 342" fill="none" stroke="#9b5cff" stroke-opacity=".13" stroke-width="4.5"/>
  <path d="M850 309 C861 311,872 315,883 321" fill="none" stroke="#9b5cff" stroke-opacity=".82" stroke-width="4.5"/>
  <text x="862" y="296" class="s">选中点</text>
  <text x="930" y="518" class="b">短预亮不变　·　后段底线轻微提亮</text>

  <rect x="55" y="610" width="1330" height="515" rx="32" fill="#1d1e1c"/>
  <circle cx="105" cy="664" r="24" fill="#9757ff"/><text x="105" y="672" text-anchor="middle" class="s" fill="#fff">2</text>
  <text x="155" y="658" class="h">周期切换：旧线倒着退场，新线正着进场</text>
  <text x="155" y="696" class="b">这个方向很好。两段稍微重叠，不要等旧线完全退完才开始新线。</text>

  <g transform="translate(95 760)">
    <g>
      <rect width="278" height="205" rx="22" fill="#171816" stroke="#3e3f3c"/>
      <path d="M25 145 C75 112,105 157,150 112 S215 70,253 105" fill="none" stroke="#8259bd" stroke-width="4"/>
      <text x="139" y="188" text-anchor="middle" class="b">0 ms · 旧线完整</text>
    </g>
    <g transform="translate(318 0)">
      <rect width="278" height="205" rx="22" fill="#171816" stroke="#3e3f3c"/>
      <path d="M25 145 C75 112,105 157,150 112" fill="none" stroke="#8259bd" stroke-width="4"/>
      <path d="M25 150 C55 130,70 128,88 118" fill="none" stroke="#9b5cff" stroke-width="5"/>
      <text x="139" y="188" text-anchor="middle" class="b">80 ms · 旧退 / 新进</text>
    </g>
    <g transform="translate(636 0)">
      <rect width="278" height="205" rx="22" fill="#171816" stroke="#3e3f3c"/>
      <path d="M25 145 C60 118,82 135,105 128" fill="none" stroke="#8259bd" stroke-width="4"/>
      <path d="M25 150 C65 126,96 142,135 105 S190 92,210 80" fill="none" stroke="#9b5cff" stroke-width="5"/>
      <text x="139" y="188" text-anchor="middle" class="b">160 ms · 新线占主导</text>
    </g>
    <g transform="translate(954 0)">
      <rect width="278" height="205" rx="22" fill="#171816" stroke="#3e3f3c"/>
      <path d="M25 150 C65 126,96 142,135 105 S190 92,253 65" fill="none" stroke="#9b5cff" stroke-width="5"/>
      <text x="139" y="188" text-anchor="middle" class="b">240 ms · 新线完整</text>
    </g>
  </g>
  <text x="105" y="1030" class="s" fill="#a989d6">旧线：从右端往左擦除</text>
  <text x="500" y="1030" class="s">＋</text>
  <text x="545" y="1030" class="s" fill="#c19aff">新线：从左端往右绘制</text>
  <text x="1020" y="1030" class="s">总时长约 220–260 ms</text>
  <text x="105" y="1080" class="b">连续滑过多个周期时，新选择直接打断上一个切换，不排队。</text>

  <rect x="55" y="1165" width="1330" height="390" rx="32" fill="#1d1e1c"/>
  <circle cx="105" cy="1219" r="24" fill="#9757ff"/><text x="105" y="1227" text-anchor="middle" class="s" fill="#fff">3</text>
  <text x="155" y="1213" class="h">重新打开 App：不重画</text>
  <text x="155" y="1251" class="b">直接显示完整曲线。只有数据本身发生变化，才做轻量更新。</text>
  <g transform="translate(120 1320)">
    <rect width="520" height="145" rx="24" fill="#171816" stroke="#3e3f3c"/>
    <text x="28" y="38" class="s">现在</text>
    <path d="M30 112 C95 75,140 120,205 83" fill="none" stroke="#9b5cff" stroke-width="4.5"/>
    <text x="270" y="96" class="b">打开 → 又从头画一遍 …</text>
  </g>
  <g transform="translate(790 1320)">
    <rect width="520" height="145" rx="24" fill="#171816" stroke="#3e3f3c"/>
    <text x="28" y="38" class="s">改后</text>
    <path d="M30 112 C95 75,140 120,205 83 S305 68,370 105 S425 95,490 65" fill="none" stroke="#9b5cff" stroke-width="4.5"/>
    <circle cx="490" cy="65" r="5" fill="#fff"/>
    <text x="270" y="96" class="b">打开 → 完整曲线立即出现</text>
  </g>
</svg>