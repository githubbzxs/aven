<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <filter id="glow" x="-80%" y="-300%" width="260%" height="700%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" rx="32" fill="#191918"/>
  <text x="64" y="72" fill="#ffffff" font-size="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">时间范围选择器 · 最终方向</text>
  <text x="64" y="112" fill="#9d9da4" font-size="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">透明背景 + 紫色 underline + Spring / Stretch</text>

  <rect x="64" y="150" width="1272" height="270" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity=".07"/>
  <text x="102" y="198" fill="#b66cff" font-size="20" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">最终静态状态</text>
  <text x="102" y="230" fill="#8d8d95" font-size="17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">注意：下面的时间选择器本身没有任何灰色/玻璃/胶囊底板。</text>

  <!-- Transparent selector area: intentionally no background shape -->
  <g transform="translate(160 280)">
    <text x="110" y="34" text-anchor="middle" fill="#8f8f98" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">24H</text>
    <text x="380" y="34" text-anchor="middle" fill="#b66cff" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">7D</text>
    <text x="650" y="34" text-anchor="middle" fill="#8f8f98" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">30D</text>
    <text x="920" y="34" text-anchor="middle" fill="#8f8f98" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">1Y</text>
    <rect x="348" y="58" width="64" height="4" rx="2" fill="#b66cff" filter="url(#glow)"/>
  </g>

  <text x="64" y="486" fill="#ffffff" font-size="26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">24H → 7D 动画分解</text>
  <text x="64" y="518" fill="#8d8d95" font-size="17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">横条先向目标方向拉伸，再滑动，越过目标一点后回弹稳定。</text>

  <g transform="translate(64 560)">
    <rect width="232" height="180" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">① 起始</text>
    <text x="62" y="94" text-anchor="middle" fill="#b66cff" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">24H</text>
    <text x="168" y="94" text-anchor="middle" fill="#8f8f98" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">7D</text>
    <rect x="40" y="118" width="44" height="4" rx="2" fill="#b66cff" filter="url(#glow)"/>
    <text x="20" y="156" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">正常宽度</text>
  </g>

  <g transform="translate(324 560)">
    <rect width="232" height="180" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">② Stretch</text>
    <text x="62" y="94" text-anchor="middle" fill="#b66cff" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">24H</text>
    <text x="168" y="94" text-anchor="middle" fill="#8f8f98" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">7D</text>
    <rect x="40" y="118" width="86" height="4" rx="2" fill="#b66cff" filter="url(#glow)"/>
    <text x="20" y="156" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">向右拉长</text>
  </g>

  <g transform="translate(584 560)">
    <rect width="232" height="180" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">③ Slide</text>
    <text x="62" y="94" text-anchor="middle" fill="#8f8f98" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">24H</text>
    <text x="168" y="94" text-anchor="middle" fill="#b66cff" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">7D</text>
    <rect x="86" y="118" width="88" height="4" rx="2" fill="#b66cff" filter="url(#glow)"/>
    <text x="20" y="156" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">拉伸状态滑行</text>
  </g>

  <g transform="translate(844 560)">
    <rect width="232" height="180" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">④ Spring</text>
    <text x="62" y="94" text-anchor="middle" fill="#8f8f98" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">24H</text>
    <text x="168" y="94" text-anchor="middle" fill="#b66cff" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">7D</text>
    <rect x="153" y="118" width="52" height="4" rx="2" fill="#b66cff" filter="url(#glow)"/>
    <text x="20" y="156" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">轻微 overshoot</text>
  </g>

  <g transform="translate(1104 560)">
    <rect width="232" height="180" rx="22" fill="#211a29" stroke="#b66cff" stroke-opacity=".3"/>
    <text x="20" y="34" fill="#b66cff" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">⑤ 稳定</text>
    <text x="62" y="94" text-anchor="middle" fill="#8f8f98" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">24H</text>
    <text x="168" y="94" text-anchor="middle" fill="#b66cff" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">7D</text>
    <rect x="146" y="118" width="44" height="4" rx="2" fill="#b66cff" filter="url(#glow)"/>
    <text x="20" y="156" fill="#9b7db9" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">恢复正常宽度</text>
  </g>

  <rect x="64" y="786" width="1272" height="72" rx="20" fill="#251b2e"/>
  <text x="94" y="830" fill="#d4b1ff" font-size="19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">要点：没有灰色底块；紫色只出现在选中文字与 underline，动画只作用于 underline。</text>
</svg>