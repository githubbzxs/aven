<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <filter id="glow" x="-80%" y="-300%" width="260%" height="700%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b66cff"/>
    </marker>
  </defs>

  <rect width="1400" height="900" rx="32" fill="#191918"/>
  <text x="64" y="72" fill="#ffffff" font-size="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">时间范围选择器 · 更 Q 弹 + 按住滑动切换</text>
  <text x="64" y="112" fill="#9d9da4" font-size="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">保持透明背景和紫色下划线，重点升级手感与连续滑动交互。</text>

  <rect x="64" y="154" width="1272" height="286" rx="28" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
  <text x="102" y="202" fill="#b66cff" font-size="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">1. 按住连续滑动</text>
  <text x="102" y="234" fill="#8f8f98" font-size="17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">手指按住后不抬起，横向滑过 24H / 7D / 30D / 1Y；进入哪个区间，哪个区间立即成为当前选项。</text>

  <g transform="translate(160 290)">
    <text x="110" y="34" text-anchor="middle" fill="#8f8f98" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">24H</text>
    <text x="380" y="34" text-anchor="middle" fill="#8f8f98" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">7D</text>
    <text x="650" y="34" text-anchor="middle" fill="#b66cff" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">30D</text>
    <text x="920" y="34" text-anchor="middle" fill="#8f8f98" font-size="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">1Y</text>
    <rect x="618" y="58" width="64" height="4" rx="2" fill="#b66cff" filter="url(#glow)"/>
    <path d="M95 100 C220 132, 360 74, 505 110 S735 112, 915 96" fill="none" stroke="#b66cff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="95" cy="100" r="17" fill="#b66cff" fill-opacity=".22" stroke="#b66cff" stroke-width="3"/>
    <text x="95" y="151" text-anchor="middle" fill="#bca1da" font-size="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">按住</text>
    <text x="920" y="151" text-anchor="middle" fill="#bca1da" font-size="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">不抬手滑到目标</text>
  </g>

  <text x="64" y="504" fill="#ffffff" font-size="26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700">2. 更 Q 弹的下划线</text>
  <text x="64" y="536" fill="#8d8d95" font-size="17" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">比上一版更短促、更低阻尼：横向拉长时同时轻微压扁，到位后有更明显但仍克制的回弹。</text>

  <g transform="translate(64 580)">
    <rect width="232" height="190" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">① 静止</text>
    <rect x="88" y="104" width="56" height="5" rx="2.5" fill="#b66cff" filter="url(#glow)"/>
    <text x="116" y="151" text-anchor="middle" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">正常形态</text>
  </g>

  <g transform="translate(324 580)">
    <rect width="232" height="190" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">② 拉伸</text>
    <rect x="62" y="105" width="108" height="3.8" rx="1.9" fill="#b66cff" filter="url(#glow)"/>
    <text x="116" y="151" text-anchor="middle" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">拉长 + 轻压扁</text>
  </g>

  <g transform="translate(584 580)">
    <rect width="232" height="190" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">③ 吸附</text>
    <rect x="104" y="104" width="88" height="4.2" rx="2.1" fill="#b66cff" filter="url(#glow)"/>
    <path d="M96 106 C78 106, 74 90, 84 82" fill="none" stroke="#b66cff" stroke-width="3" stroke-linecap="round"/>
    <text x="116" y="151" text-anchor="middle" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">快速吸向目标</text>
  </g>

  <g transform="translate(844 580)">
    <rect width="232" height="190" rx="22" fill="#202020" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="20" y="34" fill="#9e9ea5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">④ 回弹</text>
    <rect x="97" y="102" width="69" height="5.6" rx="2.8" fill="#b66cff" filter="url(#glow)"/>
    <path d="M170 106 C190 98, 193 118, 178 126" fill="none" stroke="#b66cff" stroke-width="3" stroke-linecap="round"/>
    <text x="116" y="151" text-anchor="middle" fill="#797981" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">更明显的回弹</text>
  </g>

  <g transform="translate(1104 580)">
    <rect width="232" height="190" rx="22" fill="#211a29" stroke="#b66cff" stroke-opacity=".3"/>
    <text x="20" y="34" fill="#b66cff" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">⑤ 稳定</text>
    <rect x="88" y="104" width="56" height="5" rx="2.5" fill="#b66cff" filter="url(#glow)"/>
    <text x="116" y="151" text-anchor="middle" fill="#9b7db9" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">快速稳定</text>
  </g>

  <rect x="64" y="806" width="1272" height="54" rx="18" fill="#251b2e"/>
  <text x="94" y="840" fill="#d4b1ff" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600">连续滑动时，每跨过一个分段立即切换并触发反馈；不需要抬手重新点击。</text>
</svg>
